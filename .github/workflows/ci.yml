name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Fail instead of skipping the Delta tests if the Delta jar cannot be resolved.
      REQUIRE_DELTA: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Spark packages
        uses: actions/cache@v4
        with:
          path: ~/.ivy2.5.2
          key: ivy-${{ hashFiles('pyproject.toml') }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
